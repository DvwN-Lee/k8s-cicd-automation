---
# Docker Registry with TLS enabled
# Usage: kubectl apply -f deployment-tls.yaml
# Note: Also apply tls-secret.yaml first

apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: devops
  labels:
    app: docker-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-registry
  template:
    metadata:
      labels:
        app: docker-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: registry
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            # TLS Configuration
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: "/certs/tls.crt"
            - name: REGISTRY_HTTP_TLS_KEY
              value: "/certs/tls.key"
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: registry-pvc
        - name: tls-certs
          secret:
            secretName: registry-tls-secret
      nodeSelector:
        kubernetes.io/hostname: k8s-w1
