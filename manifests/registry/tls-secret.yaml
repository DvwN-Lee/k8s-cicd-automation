---
# TLS Secret for Docker Registry
# 아래 명령으로 인증서를 생성한 뒤 base64 인코딩하여 tls.crt, tls.key에 입력하세요:
#
# openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#   -keyout registry.key -out registry.crt \
#   -subj "/CN=<YOUR_REGISTRY_IP>" \
#   -addext "subjectAltName=IP:<YOUR_REGISTRY_IP>,DNS:registry.local"
#
# base64 -i registry.crt  →  tls.crt 값
# base64 -i registry.key  →  tls.key 값

apiVersion: v1
kind: Secret
metadata:
  name: registry-tls-secret
  namespace: devops
type: kubernetes.io/tls
data:
  tls.crt: <BASE64_ENCODED_CERTIFICATE>
  tls.key: <BASE64_ENCODED_PRIVATE_KEY>
