[masters]
k8s-m ansible_host=192.168.0.174

[workers]
k8s-w1 ansible_host=192.168.0.19 node_role=gitlab-node
k8s-w2 ansible_host=192.168.0.77 node_role=jenkins-node

[k8s_cluster:children]
masters
workers

[k8s_cluster:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/k8s_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyCommand="ssh -i ~/.ssh/k8s_key -p 2222 -W %h:%p -o StrictHostKeyChecking=no ubuntu@10.0.1.59"'